name: GeospatialFM Weekly Pipeline

on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      skip_newsletter:
        description: 'Skip newsletter generation (true/false)'
        required: false
        default: 'false'
      skip_13f:
        description: 'Skip 13F filing fetch (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

# Shared git helper used in every commit step:
#   git_commit <path> <message>
# Stashes any untracked/unstaged changes, pulls with rebase, pops stash,
# stages the target path, and pushes only if there is something new to commit.

jobs:
  # ── Job 1: Snapshot ────────────────────────────────────────────────────────
  snapshot:
    name: "Capture Market Snapshot"
    runs-on: ubuntu-latest
    outputs:
      snapshot_path: ${{ steps.capture.outputs.snapshot_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so rebase has context

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Capture snapshot
        id: capture
        run: |
          python scripts/capture_snapshot.py
          LATEST=$(find snapshots -name "snapshot_????-??-??.parquet" | sort | tail -1)
          [ -z "$LATEST" ] && LATEST=$(find snapshots -name "*.parquet" | sort | tail -1)
          echo "snapshot_path=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest snapshot: $LATEST"

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-snapshot-${{ github.run_number }}
          path: snapshots/
          retention-days: 90

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: snapshot $(date -u +%Y-%m-%d)"
          git push

  # ── Job 2: 13F Filings ────────────────────────────────────────────────────
  filings:
    name: "Fetch 13F Filings"
    runs-on: ubuntu-latest
    needs: snapshot
    if: ${{ github.event.inputs.skip_13f != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull latest (snapshot commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Ensure filings directories exist
        run: |
          mkdir -p filings/13f
          touch filings/13f/.gitkeep

      - name: Fetch 13F filings
        run: |
          python scripts/fetch_13f_filings.py \
            --universe geospatial_companies_cleaned.parquet \
            --output-dir filings/13f \
            --lookback-days 90 \
            --max-filings 50

      - uses: actions/upload-artifact@v4
        with:
          name: 13f-filings-${{ github.run_number }}\
          path: filings/
          retention-days: 180

      - name: Commit 13F data
        run: |
          git add filings/
          git diff --cached --quiet && echo "No new filings to commit" && exit 0
          git commit -m "chore: 13f filings $(date -u +%Y-%m-%d)"
          git push

  # ── Job 3: Newsletter ─────────────────────────────────────────────────────
  newsletter:
    name: "Generate Newsletter"
    runs-on: ubuntu-latest
    needs: [snapshot, filings]
    if: always() && needs.snapshot.result == 'success' && github.event.inputs.skip_newsletter != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull latest (snapshot + filings commits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Verify snapshots exist
        run: |
          COUNT=$(find snapshots -name "*.parquet" | wc -l)
          echo "Snapshot parquet files found: $COUNT"
          find snapshots -name "*.parquet" | sort | tail -5
          [ "$COUNT" -eq 0 ] && echo "ERROR: no snapshots found" && exit 1 || true

      - name: Ensure output directories exist
        run: |
          mkdir -p newsletters filings/13f
          touch filings/13f/.gitkeep

      - name: Generate newsletter
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          python scripts/generate_newsletter.py \
            --snapshots-dir snapshots \
            --output-dir newsletters \
            --filings-dir filings/13f

      - uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_number }}
          path: newsletters/
          retention-days: 365

      - name: Commit newsletter
        run: |
          git add newsletters/
          git diff --cached --quiet && echo "No newsletter to commit" && exit 0
          git commit -m "feat: newsletter $(date -u +%Y-%m-%d)"
          git push
